<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaipenHub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #fff);
      --text: var(--tg-theme-text-color, #000);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f2);
      --accent: var(--tg-theme-button-color, #3390ec);
      --accent-text: var(--tg-theme-button-text-color, #fff);
    }
    body { margin: 0 auto; padding: 12px; max-width: 640px; font-family: system-ui, sans-serif;
           background: var(--bg); color: var(--text); }
    h2 { margin: 4px 0 8px; }
    button, select { padding: 9px 12px; border: none; border-radius: 10px; font-size: 14px;
                     background: var(--card); color: var(--text); }
    button.active { background: var(--accent); color: var(--accent-text); }
    select { width: 100%; margin: 6px 0 8px; }
    .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px;
            padding: 8px 0; background: var(--bg); }
    .tabs button { flex: 1; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
    .chips button { flex: none; white-space: nowrap; }
    .muted { opacity: .7; font-size: 13px; margin-top: 8px; }
    .card { margin: 8px 0; padding: 10px; border-radius: 12px; background: var(--card); }

    .tier { display: flex; gap: 10px; margin: 8px 0; padding: 10px;
            border-radius: 12px; background: var(--card); }
    .badge { flex: none; width: 34px; height: 34px; border-radius: 8px; color: #fff;
             display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .t-S { background: #e5484d; } .t-A { background: #f08c00; } .t-B { background: #c89b00; }
    .t-C { background: #3fa66a; } .t-D { background: #6b7a8f; }
    .heroes { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 8px; border-radius: 8px; font-size: 14px; background: rgba(127,127,127,.15); }
    .chip small { opacity: .7; margin-left: 4px; }

    .stage { margin: 8px 0; padding: 6px 10px; border-radius: 12px; background: var(--card); }
    .stage summary { font-weight: 700; padding: 6px 0; cursor: pointer; }
    .irow { display: grid; grid-template-columns: 1fr 64px 52px; gap: 8px; align-items: center;
            padding: 5px 0; border-top: 1px solid rgba(127,127,127,.2); font-size: 14px; }
    .ihead { opacity: .6; font-size: 12px; border-top: none; }
    .iname { display: flex; align-items: center; gap: 6px; }
    .icon { width: 24px; height: 24px; border-radius: 4px; flex: none; }
    .pick { position: relative; height: 18px; border-radius: 6px; overflow: hidden;
            background: rgba(127,127,127,.2); text-align: center; font-size: 12px; line-height: 18px; }
    .pick i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .45; }
    .pick b { position: relative; font-weight: 600; }
    .wr { text-align: right; font-weight: 600; }
    .good { color: #3fa66a; } .bad { color: #e5484d; }
  </style>
</head>
<body>
  <h2>KaipenHub</h2>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Иконки предметов принадлежат Valve. Включай только после проверки условий использования.
    const SHOW_ICONS = false;

    const API = "https://api.deadlock-api.com";
    const RANKS = ["Initiate", "Seeker", "Alchemist", "Arcanist", "Ritualist",
                   "Emissary", "Archon", "Oracle", "Phantom", "Ascendant", "Eternus"];
    const STAGES = [["early_game", "Начало игры"], ["mid_game", "Середина игры"],
                    ["late_game", "Поздняя игра"]];

    const user = tg.initDataUnsafe.user;
    const lang = (user && user.language_code === "ru") ? "russian" : "english";

    let tab = "tier";
    let period = 30;
    let rank = "all";
    let selectedHero = null;
    let heroes = null;
    let itemMap = null;

    const $ = id => document.getElementById(id);

    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;   // textContent безопасен: это не HTML
      if (cls) e.className = cls;
      return e;
    }

    function makeButton(text, active, onClick) {
      const b = el("button", text, active ? "active" : "");
      b.onclick = onClick;
      return b;
    }

    async function getJson(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error(path + ": HTTP " + res.status);
      return res.json();
    }

    async function loadHeroes() {
      if (heroes) return heroes;
      const raw = await getJson(`/v1/assets/heroes?language=${lang}`);
      heroes = raw
        .filter(h => h.player_selectable && !h.disabled && !h.in_development)
        .map(h => ({ id: h.id, name: h.name, popular: h.popular_items || null }));
      return heroes;
    }

    async function loadItems() {
      if (itemMap) return itemMap;
      itemMap = {};
      try {
        const arr = await getJson(`/v1/assets/items/by-type/upgrade?language=${lang}`);
        arr.forEach(it => {
          if (!it.name) return;
          const info = { name: it.name, image: it.image_webp || it.image || null };
          if (it.class_name) itemMap[it.class_name] = info;
          if (it.id !== undefined) itemMap[it.id] = info;
        });
      } catch (e) { /* названия не загрузились, покажем технические */ }
      return itemMap;
    }

    function prettyName(className) {
      return className.replace(/^upgrade_/, "").replace(/_/g, " ");
    }

    function renderTabs() {
      $("tabs").replaceChildren(
        makeButton("Тир-лист", tab === "tier", () => { tab = "tier"; show(); }),
        makeButton("Билды", tab === "builds", () => { tab = "builds"; show(); }),
        makeButton("О боте", tab === "about", () => { tab = "about"; show(); })
      );
    }

    function show() {
      renderTabs();
      if (tab === "tier") showTier();
      else if (tab === "builds") showBuilds();
      else showAbout();
    }

    /* ---------- Тир-лист ---------- */
    function tierFor(diff) {
      if (diff >= 3) return "S";
      if (diff >= 1.5) return "A";
      if (diff >= -1.5) return "B";
      if (diff >= -3) return "C";
      return "D";
    }

    function tierControls() {
      const periods = el("div", undefined, "chips");
      [7, 30].forEach(p => periods.appendChild(
        makeButton(p + " дней", period === p, () => { period = p; showTier(); })));
      const ranks = el("div", undefined, "chips");
      ranks.appendChild(makeButton("Все ранги", rank === "all", () => { rank = "all"; showTier(); }));
      RANKS.forEach((name, i) => ranks.appendChild(
        makeButton(name, rank === i + 1, () => { rank = i + 1; showTier(); })));
      return [periods, ranks];
    }

    async function showTier() {
      const out = el("div", "Загрузка...");
      $("view").replaceChildren(...tierControls(), out);
      try {
        const params = new URLSearchParams({
          min_unix_timestamp: Math.floor(Date.now() / 1000) - period * 86400
        });
        if (rank !== "all") {
          params.set("min_average_badge", rank * 10 + 1);
          params.set("max_average_badge", rank * 10 + 6);
        }
        const stats = await getJson(`/v1/analytics/hero-stats?${params}`);
        const list = await loadHeroes();
        const nameMap = {};
        list.forEach(h => nameMap[h.id] = h.name);

        const total = stats.reduce((s, h) => s + h.matches, 0);
        const minMatches = Math.max(50, total / stats.length * 0.25);
        const rows = stats
          .filter(h => h.matches >= minMatches && nameMap[h.hero_id])
          .map(h => ({ name: nameMap[h.hero_id], winrate: h.wins / h.matches * 100 }));
        if (rows.length === 0) { out.textContent = "Для этого фильтра мало данных."; return; }

        const avg = rows.reduce((s, h) => s + h.winrate, 0) / rows.length;
        rows.sort((a, b) => b.winrate - a.winrate);
        const groups = { S: [], A: [], B: [], C: [], D: [] };
        rows.forEach(h => groups[tierFor(h.winrate - avg)].push(h));

        const nodes = [];
        for (const t of ["S", "A", "B", "C", "D"]) {
          if (groups[t].length === 0) continue;
          const block = el("div", undefined, "tier");
          block.appendChild(el("div", t, "badge t-" + t));
          const wrap = el("div", undefined, "heroes");
          groups[t].forEach(h => {
            const chip = el("span", h.name + " ", "chip");
            chip.appendChild(el("small", h.winrate.toFixed(1) + "%"));
            wrap.appendChild(chip);
          });
          block.appendChild(wrap);
          nodes.push(block);
        }
        nodes.push(el("div", `Выборка: ${total.toLocaleString("ru-RU")} игр героев`, "muted"));
        out.replaceChildren(...nodes);
      } catch (e) {
        out.textContent = "Не удалось загрузить данные: " + e.message;
      }
    }

    /* ---------- Билды ---------- */
    async function showBuilds() {
      $("view").replaceChildren(el("div", "Загрузка..."));
      try {
        const list = await loadHeroes();
        const sorted = [...list].sort((a, b) => a.name.localeCompare(b.name));
        if (selectedHero === null) selectedHero = sorted[0].id;

        const select = document.createElement("select");
        sorted.forEach(h => {
          const o = el("option", h.name);
          o.value = h.id;
          if (h.id === selectedHero) o.selected = true;
          select.appendChild(o);
        });
        const box = el("div");
        select.onchange = () => { selectedHero = Number(select.value); renderBuild(box); };
        $("view").replaceChildren(select, box);
        await renderBuild(box);
      } catch (e) {
        $("view").textContent = "Не удалось загрузить данные: " + e.message;
      }
    }

    function itemRow(it, names) {
      const info = names[it.class_name] || names[it.item_id];
      const row = el("div", undefined, "irow");

      const nameCell = el("div", undefined, "iname");
      if (SHOW_ICONS && info && info.image) {
        const img = el("img", undefined, "icon");
        img.src = info.image;
        img.alt = "";
        img.loading = "lazy";
        nameCell.appendChild(img);
      }
      nameCell.appendChild(el("span", info ? info.name : prettyName(it.class_name)));
      row.appendChild(nameCell);

      const pick = el("div", undefined, "pick");
      const bar = document.createElement("i");
      bar.style.width = Math.min(100, it.pick_pct) + "%";
      pick.appendChild(bar);
      pick.appendChild(el("b", it.pick_pct.toFixed(0) + "%"));
      row.appendChild(pick);

      const cls = it.winrate_pct >= 53 ? "wr good" : it.winrate_pct < 49 ? "wr bad" : "wr";
      row.appendChild(el("div", it.winrate_pct.toFixed(1) + "%", cls));
      return row;
    }

    async function renderBuild(box) {
      const hero = heroes.find(h => h.id === selectedHero);
      const names = await loadItems();
      if (!hero || !hero.popular) {
        box.replaceChildren(el("div", "Для этого героя пока нет данных о предметах."));
        return;
      }
      const nodes = [];
      STAGES.forEach(([key, title], idx) => {
        const items = (hero.popular[key] || [])
          .slice().sort((a, b) => b.pick_pct - a.pick_pct).slice(0, 8);
        if (items.length === 0) return;

        const det = document.createElement("details");
        det.className = "stage";
        if (idx === 0) det.open = true;           // раскрыта только первая стадия
        det.appendChild(el("summary", title));

        const head = el("div", undefined, "irow ihead");
        ["Предмет", "Берут", "Винрейт"].forEach((text, i) => {
          const c = el("div", text);
          if (i === 2) c.style.textAlign = "right";
          head.appendChild(c);
        });
        det.appendChild(head);
        items.forEach(it => det.appendChild(itemRow(it, names)));
        nodes.push(det);
      });

      const ts = hero.popular.timestamp;
      const date = ts ? new Date(ts * 1000).toLocaleDateString("ru-RU") : "дата неизвестна";
      nodes.push(el("div",
        `Самые часто покупаемые предметы героя. Обновлено: ${date}. ` +
        "Период и ранги выбирает сам API, мы их не меняем.", "muted"));
      box.replaceChildren(...nodes);
    }

    /* ---------- О боте ---------- */
    function showAbout() {
      const card = el("div", undefined, "card");
      [
        "KaipenHub: неофициальный бот и мини-приложение по игре Deadlock. Не связан с Valve.",
        "Тир-лист героев по статистике матчей за 7 или 30 дней, с выбором ранга.",
        "Билды: самые часто покупаемые предметы выбранного героя.",
        "Данные: открытый проект Deadlock API (deadlock-api.com), он тоже не связан с Valve. " +
        "Ярусы считаются по отклонению винрейта от среднего: это оценка, на малых выборках возможны случайные колебания.",
        "Нашли ошибку или есть вопрос? Пишите @twoflk."
      ].forEach(text => card.appendChild(el("p", text)));
      $("view").replaceChildren(card, makeButton("Написать @twoflk", true,
        () => tg.openTelegramLink("https://t.me/twoflk")));
    }

    show();
  </script>
</body>
</html>
