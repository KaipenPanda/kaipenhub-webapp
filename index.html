<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaipenHub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0; padding: 16px;
      font-family: sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    button {
      width: 100%; padding: 12px; margin-top: 8px;
      border: none; border-radius: 8px; font-size: 16px;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
    }
  </style>
</head>
<body>
  <h2>KaipenHub</h2>
  <p id="hello">Загрузка...</p>
  <button onclick="showBuilds()">Билды</button>
  <button onclick="showTier()">Тир-лист</button>
  <div id="content"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;
    document.getElementById("hello").textContent =
      "Привет, " + (user ? user.first_name : "игрок") + "!";

    function showBuilds() {
      document.getElementById("content").textContent = "Здесь будут билды";
    }
    function showTier() {
      document.getElementById("content").textContent = "Здесь будет тир-лист";
    }
  </script>
</body>
</html>
